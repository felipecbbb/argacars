<style>
:root{
  --ink:#0a0a0a;
  --gold:#c5a572;
  --gold-soft:#d4b988;
  --f:'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  min-height:100svh;
  background:var(--ink);
  color:#fff;
  font-family:var(--f);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
img{ display:block; max-width:100%; }

/* ===== FONDO ===== */
.bg{ position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--ink); }
.bg img{
  width:100%; height:100%;
  object-fit:cover; object-position:center 38%;
  opacity:.42;
  filter:grayscale(.15) contrast(1.06) brightness(.95);
}
/* velo oscuro para que el contenido siempre se lea */
.bg::after{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(115% 75% at 50% 42%, rgba(10,10,10,.30) 0%, rgba(10,10,10,.70) 58%, rgba(10,10,10,.93) 100%),
    linear-gradient(to bottom, rgba(10,10,10,.72) 0%, rgba(10,10,10,.20) 34%, rgba(10,10,10,.88) 100%);
}
/* degradados de profundidad por las esquinas */
.glow{ position:fixed; z-index:1; border-radius:999px; pointer-events:none; filter:blur(90px); }
.glow.a{ width:min(60vw,620px); aspect-ratio:1; top:-16vh; right:-14vw; background:rgba(255,255,255,.10); }
.glow.b{ width:min(52vw,520px); aspect-ratio:1; bottom:-18vh; left:-14vw; background:rgba(197,165,114,.14); }

/* ===== LAYOUT ===== */
.wrap{
  position:relative; z-index:2;
  min-height:100svh;
  display:flex; flex-direction:column; align-items:center;
  gap:clamp(26px,4.2vh,44px);
  padding:clamp(30px,6vh,60px) clamp(20px,5vw,28px) clamp(38px,7vh,64px);
  justify-content:center;
}

/* ===== LOGO ===== */
.logo{ width:clamp(132px,26vw,188px); height:auto; flex:none; }

/* ===== VÍDEO ===== */
.player{
  width:100%; max-width:760px;
  border-radius:clamp(16px,3vw,22px);
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.04);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.07);
  overflow:hidden;
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
}
.player .frame{ position:relative; aspect-ratio:16/9; background:#0d0d0d; }
.player video, .player iframe{
  position:absolute; inset:0; width:100%; height:100%; border:0; display:block; object-fit:contain; background:#000;
}

/* ===== CAPA "ACTIVAR SONIDO" ===== */
.soundgate{
  position:absolute; inset:0; z-index:3;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  background:linear-gradient(180deg, rgba(10,10,10,.30) 0%, rgba(10,10,10,.62) 100%);
  cursor:pointer; border:0; width:100%; padding:20px;
  font-family:inherit; color:#fff; text-align:center;
  -webkit-backdrop-filter:blur(1.5px); backdrop-filter:blur(1.5px);
  transition:opacity .3s ease, visibility .3s ease;
}
.soundgate[hidden]{ display:none; }
.soundgate .ring{
  width:clamp(64px,13vw,84px); aspect-ratio:1; border-radius:999px; flex:none;
  display:grid; place-items:center;
  background:linear-gradient(180deg, var(--gold-soft) 0%, var(--gold) 100%);
  box-shadow:0 14px 40px -10px rgba(0,0,0,.75), 0 0 0 0 rgba(197,165,114,.55);
  animation:pulse 2.4s ease-out infinite;
}
.soundgate .ring svg{ width:44%; height:auto; fill:#0a0a0a; }
.soundgate .txt{
  font-size:clamp(13px,3.3vw,15px); font-weight:700; letter-spacing:-.01em;
  text-shadow:0 2px 12px rgba(0,0,0,.6);
}
.soundgate .sub{
  font-size:clamp(11px,2.7vw,12.5px); font-weight:500; color:rgba(255,255,255,.66);
  text-shadow:0 2px 10px rgba(0,0,0,.6); margin-top:-6px;
}
@keyframes pulse{
  0%   { box-shadow:0 14px 40px -10px rgba(0,0,0,.75), 0 0 0 0 rgba(197,165,114,.5); }
  70%  { box-shadow:0 14px 40px -10px rgba(0,0,0,.75), 0 0 0 22px rgba(197,165,114,0); }
  100% { box-shadow:0 14px 40px -10px rgba(0,0,0,.75), 0 0 0 0 rgba(197,165,114,0); }
}
@media (prefers-reduced-motion:reduce){ .soundgate .ring{ animation:none; } }

/* ===== CTA ===== */
.cta{
  display:inline-flex; align-items:center; justify-content:center; gap:12px;
  width:100%; max-width:520px;
  padding:clamp(17px,2.4vh,21px) clamp(26px,5vw,40px);
  border-radius:999px;
  background:linear-gradient(180deg, var(--gold-soft) 0%, var(--gold) 100%);
  color:#0a0a0a; text-decoration:none;
  font-size:clamp(15px,3.7vw,17.5px); font-weight:800; letter-spacing:-.01em;
  border:1px solid rgba(255,255,255,.28);
  box-shadow:0 18px 44px -14px rgba(197,165,114,.55), inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .22s cubic-bezier(.16,1,.3,1), box-shadow .22s cubic-bezier(.16,1,.3,1);
  text-align:center;
}
.cta svg{ width:19px; height:19px; flex:none; fill:#0a0a0a; }
.cta:hover{ transform:translateY(-2px); box-shadow:0 24px 56px -14px rgba(197,165,114,.7), inset 0 1px 0 rgba(255,255,255,.55); }
.cta:active{ transform:translateY(0); }

/* ===== LÍNEA EXPLICATIVA ===== */
.note{ width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center; gap:16px; }
.note .rule{ width:100%; height:1px; background:linear-gradient(to right, transparent, rgba(255,255,255,.22), transparent); }
.note p{
  margin:0; text-align:center;
  font-size:clamp(13px,3.3vw,14.5px); line-height:1.6;
  color:rgba(255,255,255,.62);
}
.note strong{ color:#fff; font-weight:600; }

@media (max-width:520px){
  .bg img{ opacity:.46; object-position:center 32%; }
}
/* En horizontal la foto es vertical: se baja el encuadre para que entren
   los dos coches por los laterales en vez de solo el cielo y los árboles */
@media (min-width:900px){
  .bg img{ object-position:center 58%; }
}
@media (prefers-reduced-motion:reduce){
  .cta{ transition:none; }
}
</style>
</head>
<body>

<div class="bg">
  <img src="assets/hero-arga.jpg" alt="" aria-hidden="true">
</div>
<div class="glow a"></div>
<div class="glow b"></div>

<main class="wrap">

  <img class="logo" src="assets/logo-arga-blanco.png" alt="ARGA Premium Cars">

  <!-- VÍDEO · VSL
       Arranca solo. Los navegadores prohíben el autoplay CON sonido, así que
       empieza silenciado y la capa de abajo lo activa al primer toque,
       rebobinando al inicio para que no se pierda nada. -->
  <div class="player">
    <div class="frame">
      <video id="vsl"
        src="assets/vsl.mp4"
        poster="assets/vsl-poster.jpg"
        autoplay muted loop playsinline
        preload="auto"
        controlsList="nodownload"
        disablepictureinpicture>
        Tu navegador no puede reproducir el vídeo.
      </video>

      <button class="soundgate" id="soundgate" type="button" aria-label="Activar el sonido del vídeo">
        <span class="ring">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12ZM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77Z"/></svg>
        </span>
        <span class="txt">Toca para activar el sonido</span>
        <span class="sub">El vídeo ya está en marcha</span>
      </button>
    </div>
  </div>

  <!-- BOTÓN · comunidad de WhatsApp -->
  <a class="cta" id="cta"
     href="https://chat.whatsapp.com/LjdNjRDenmoLtEz1I8I3NC"
     target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm5.8 14.16c-.25.69-1.44 1.32-1.99 1.37-.53.05-1.02.24-3.43-.72-2.9-1.14-4.74-4.1-4.88-4.29-.14-.19-1.16-1.54-1.16-2.94s.73-2.09.99-2.37c.26-.29.57-.36.76-.36.19 0 .38 0 .55.01.18.01.41-.07.64.49.24.57.81 1.97.88 2.11.07.14.12.31.02.5-.09.19-.14.31-.28.47-.14.16-.3.36-.42.48-.14.14-.29.29-.12.57.16.28.73 1.21 1.57 1.96 1.08.96 1.99 1.26 2.27 1.4.28.14.45.12.61-.07.17-.19.71-.83.9-1.11.19-.29.38-.24.64-.14.26.09 1.65.78 1.93.92.28.14.47.21.54.33.07.12.07.69-.18 1.38Z"/></svg>
    Obtén tu recurso gratis
  </a>

  <div class="note">
    <div class="rule"></div>
    <p>Te llevará a nuestra <strong>comunidad de WhatsApp</strong>, donde encontrarás el recurso que te prometimos, junto a más guías y recursos útiles, y mucho más valor que iremos aportando estas semanas de forma gratuita.</p>
  </div>

</main>


<script>
(function(){
  var v = document.getElementById('vsl');
  var gate = document.getElementById('soundgate');
  if(!v || !gate) return;

  // 1) Se intenta arrancar CON sonido. Solo funciona si el navegador ya
  //    considera que el visitante interactuó antes con el dominio.
  function tryLoud(){
    v.muted = false;
    var p = v.play();
    if(p && p.catch){
      p.then(function(){ gate.hidden = true; })
       .catch(function(){ fallbackMuted(); });
    }
  }

  // 2) Plan B universal: silenciado (esto SIEMPRE está permitido) + capa
  //    para que el visitante active el sonido con un solo toque.
  function fallbackMuted(){
    v.muted = true;
    v.play().catch(function(){});
    gate.hidden = false;
  }

  function unmute(){
    gate.hidden = true;
    v.muted = false;
    v.loop = false;          // con sonido ya no se repite en bucle
    v.controls = true;
    v.currentTime = 0;       // se rebobina para no perder el arranque
    v.play().catch(function(){});
    document.removeEventListener('click', onFirstTouch, true);
    document.removeEventListener('touchstart', onFirstTouch, true);
    document.removeEventListener('keydown', onFirstTouch, true);
  }

  function onFirstTouch(e){
    // Pulsar el botón lleva a WhatsApp: no tiene sentido arrancar el sonido ahí
    if(e && e.target && e.target.closest && e.target.closest('#cta')) return;
    if(!gate.hidden) unmute();
  }

  gate.addEventListener('click', function(e){ e.stopPropagation(); unmute(); });

  // Cualquier interacción con la página vale para activar el sonido
  document.addEventListener('click', onFirstTouch, true);
  document.addEventListener('touchstart', onFirstTouch, true);
  document.addEventListener('keydown', onFirstTouch, true);

  // Si el vídeo termina en modo silenciado, se deja el póster y los controles
  v.addEventListener('ended', function(){ v.controls = true; gate.hidden = true; });

  if(v.readyState >= 2) tryLoud();
  else v.addEventListener('loadeddata', tryLoud, { once:true });
})();
</script>
</body>
