<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARGA Premium Cars · Obtén tu recurso gratis</title>
<meta name="description" content="Accede a nuestra comunidad de WhatsApp y consigue el recurso gratuito, además de guías y contenido útil sobre importación de vehículos.">
<meta name="theme-color" content="#0a0a0a">
<meta name="robots" content="noindex,nofollow">

<meta property="og:type" content="website">
<meta property="og:title" content="ARGA Premium Cars · Obtén tu recurso gratis">
<meta property="og:description" content="Entra en la comunidad de WhatsApp y consigue el recurso que te prometimos.">
<meta property="og:image" content="assets/hero-arga.jpg">

<link rel="icon" href="assets/logo-arga-blanco.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">

<style>
:root{
  --ink:#0a0a0a;
  --gold:#c5a572;
  --gold-soft:#d4b988;
  --f:'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  min-height:100svh;
  background:var(--ink);
  color:#fff;
  font-family:var(--f);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
img{ display:block; max-width:100%; }

/* ===== FONDO ===== */
.bg{ position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--ink); }
.bg img{
  width:100%; height:100%;
  object-fit:cover; object-position:center 38%;
  opacity:.42;
  filter:grayscale(.15) contrast(1.06) brightness(.95);
}
/* velo oscuro para que el contenido siempre se lea */
.bg::after{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(115% 75% at 50% 42%, rgba(10,10,10,.30) 0%, rgba(10,10,10,.70) 58%, rgba(10,10,10,.93) 100%),
    linear-gradient(to bottom, rgba(10,10,10,.72) 0%, rgba(10,10,10,.20) 34%, rgba(10,10,10,.88) 100%);
}
/* degradados de profundidad por las esquinas */
.glow{ position:fixed; z-index:1; border-radius:999px; pointer-events:none; filter:blur(90px); }
.glow.a{ width:min(60vw,620px); aspect-ratio:1; top:-16vh; right:-14vw; background:rgba(255,255,255,.10); }
.glow.b{ width:min(52vw,520px); aspect-ratio:1; bottom:-18vh; left:-14vw; background:rgba(197,165,114,.14); }

/* ===== LAYOUT ===== */
.wrap{
  position:relative; z-index:2;
  min-height:100svh;
  display:flex; flex-direction:column; align-items:center;
  gap:clamp(26px,4.2vh,44px);
  padding:clamp(30px,6vh,60px) clamp(20px,5vw,28px) clamp(38px,7vh,64px);
  justify-content:center;
}

/* ===== LOGO ===== */
.logo{ width:clamp(132px,26vw,188px); height:auto; flex:none; }

/* ===== VÍDEO ===== */
.player{
  width:100%; max-width:760px;
  border-radius:clamp(16px,3vw,22px);
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.04);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.07);
  overflow:hidden;
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
}
.player .frame{ position:relative; aspect-ratio:16/9; background:#0d0d0d; }
.player video, .player iframe{
  position:absolute; inset:0; width:100%; height:100%; border:0; display:block; object-fit:cover;
}
/* Marco provisional mientras no está el vídeo */
.ph{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  background:
    radial-gradient(80% 70% at 50% 45%, rgba(197,165,114,.12) 0%, rgba(255,255,255,0) 70%),
    linear-gradient(160deg, #141414 0%, #0b0b0b 100%);
  text-align:center; padding:22px;
}
.ph .play{
  width:clamp(58px,11vw,72px); aspect-ratio:1; border-radius:999px; flex:none;
  display:grid; place-items:center;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 10px 30px -10px rgba(0,0,0,.8);
}
.ph .play svg{ width:38%; height:auto; margin-left:14%; fill:#fff; }
.ph .lb{
  font-size:clamp(10px,2.4vw,11px); font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  color:rgba(255,255,255,.5);
}

/* ===== CTA ===== */
.cta{
  display:inline-flex; align-items:center; justify-content:center; gap:12px;
  width:100%; max-width:520px;
  padding:clamp(17px,2.4vh,21px) clamp(26px,5vw,40px);
  border-radius:999px;
  background:linear-gradient(180deg, var(--gold-soft) 0%, var(--gold) 100%);
  color:#0a0a0a; text-decoration:none;
  font-size:clamp(15px,3.7vw,17.5px); font-weight:800; letter-spacing:-.01em;
  border:1px solid rgba(255,255,255,.28);
  box-shadow:0 18px 44px -14px rgba(197,165,114,.55), inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .22s cubic-bezier(.16,1,.3,1), box-shadow .22s cubic-bezier(.16,1,.3,1);
  text-align:center;
}
.cta svg{ width:19px; height:19px; flex:none; fill:#0a0a0a; }
.cta:hover{ transform:translateY(-2px); box-shadow:0 24px 56px -14px rgba(197,165,114,.7), inset 0 1px 0 rgba(255,255,255,.55); }
.cta:active{ transform:translateY(0); }

/* ===== LÍNEA EXPLICATIVA ===== */
.note{ width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center; gap:16px; }
.note .rule{ width:100%; height:1px; background:linear-gradient(to right, transparent, rgba(255,255,255,.22), transparent); }
.note p{
  margin:0; text-align:center;
  font-size:clamp(13px,3.3vw,14.5px); line-height:1.6;
  color:rgba(255,255,255,.62);
}
.note strong{ color:#fff; font-weight:600; }

@media (max-width:520px){
  .bg img{ opacity:.46; object-position:center 32%; }
}
/* En horizontal la foto es vertical: se baja el encuadre para que entren
   los dos coches por los laterales en vez de solo el cielo y los árboles */
@media (min-width:900px){
  .bg img{ object-position:center 58%; }
}
@media (prefers-reduced-motion:reduce){
  .cta{ transition:none; }
}
</style>
</head>
<body>

<div class="bg">
  <img src="assets/hero-arga.jpg" alt="" aria-hidden="true">
</div>
<div class="glow a"></div>
<div class="glow b"></div>

<main class="wrap">

  <img class="logo" src="assets/logo-arga-blanco.png" alt="ARGA Premium Cars">

  <!-- ================================================================
       VÍDEO · cuando esté grabado, borra el bloque <div class="ph">…</div>
       y descomenta el <video>. Deja el fichero en assets/video.mp4
       ================================================================ -->
  <div class="player">
    <div class="frame">

      <!-- <video src="assets/video.mp4" poster="assets/hero-arga.jpg" controls playsinline preload="metadata"></video> -->

      <div class="ph">
        <div class="play">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <span class="lb">Aquí va el vídeo</span>
      </div>

    </div>
  </div>

  <!-- ================================================================
       BOTÓN · sustituye el href por el enlace real de la comunidad
       ================================================================ -->
  <a class="cta" href="#" id="cta">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm5.8 14.16c-.25.69-1.44 1.32-1.99 1.37-.53.05-1.02.24-3.43-.72-2.9-1.14-4.74-4.1-4.88-4.29-.14-.19-1.16-1.54-1.16-2.94s.73-2.09.99-2.37c.26-.29.57-.36.76-.36.19 0 .38 0 .55.01.18.01.41-.07.64.49.24.57.81 1.97.88 2.11.07.14.12.31.02.5-.09.19-.14.31-.28.47-.14.16-.3.36-.42.48-.14.14-.29.29-.12.57.16.28.73 1.21 1.57 1.96 1.08.96 1.99 1.26 2.27 1.4.28.14.45.12.61-.07.17-.19.71-.83.9-1.11.19-.29.38-.24.64-.14.26.09 1.65.78 1.93.92.28.14.47.21.54.33.07.12.07.69-.18 1.38Z"/></svg>
    Obtén tu recurso gratis
  </a>

  <div class="note">
    <div class="rule"></div>
    <p>Te llevará a nuestra <strong>comunidad de WhatsApp</strong>, donde encontrarás el recurso que te prometimos, más guías y recursos útiles, y todo el valor que iremos aportando estas semanas.</p>
  </div>

</main>

</body>
</html>
